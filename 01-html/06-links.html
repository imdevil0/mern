<!--
  !Topic: HTML Links
  
  ?Introduction:
   * Links (hyperlinks) allow users to navigate from one page to another. They are created using the <a> (anchor) tag.
  Analogy: Think of links as magical portals or doors that instantly teleport you to another room (page) when you click them.
  
  ?Why do we use it?
   * Without links, the web wouldn't be a "web". They connect documents together and provide navigation.
  
  ?Syntax:
   * <a href="url">link text</a>
-->

<!-- --- Basic Example --- -->
<!-- Absolute URL (linking to another website) -->
<a href="https://www.github.com">Visit GitHub</a>

<!-- Relative URL (linking to a file on your own site) -->
<a href="/about.html">About Us</a>

<!-- Opening a link in a new tab using target="_blank" -->
<a href="https://www.example.com" target="_blank">Open in new tab</a>
