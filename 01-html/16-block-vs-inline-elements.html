<!--
  !Topic: Block vs Inline Elements
  
  ?Introduction:
   * Elements are generally either block-level (takes up the full width available and starts on a new line) or inline (only takes up as much width as necessary and does not start a new line).
  Analogy: Block elements are like a couch taking up the whole wall space. Inline elements are like picture frames placed next to each other on a shelf.
  
  ?Why do we use it?
   * Understanding this flow is the fundamental key to mastering CSS layouts later.
  
  ?Syntax:
   * Block: <div>, <h1>-<h6>, <p>, <ul>, <li>
   * Inline: <span>, <a>, <img>, <strong>
-->

<!-- --- Basic Example --- -->
<!-- Block Elements -->
<div style="border: 1px solid red;">I am a block level element (div). I take the full width!</div>
<p style="border: 1px solid red;">I am a block level element (p). I start on a new line!</p>

<!-- Inline Elements -->
<span style="border: 1px solid blue;">I am an inline element (span).</span>
<a style="border: 1px solid blue;" href="#">I am inline too!</a>
<span>We sit next to each other.</span>
