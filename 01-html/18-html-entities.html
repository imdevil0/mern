<!--
  !Topic: HTML Entities
  
  ?Introduction:
   * Some characters are reserved in HTML (like < and >). If you want to display them as text, you must use character entities.
  Analogy: Like using an escape word or a secret code in conversation so you don't accidentally trigger a smart speaker.
  
  ?Why do we use it?
   * To prevent the browser from confusing your text for HTML tags, and to display special symbols like copyright (&copy;).
  
  ?Syntax:
   * &entity_name; or &#entity_number;
-->

<!-- --- Basic Example --- -->
<!-- Displaying HTML tags as text -->
<p>To write a paragraph, use the &lt;p&gt; tag.</p>

<!-- Common symbols -->
<p>Copyright &copy; 2026</p>
<p>Space separated&nbsp;&nbsp;&nbsp;by non-breaking spaces.</p>
<p>Ampersand symbol: &amp;</p>
<p>Euro symbol: &euro;</p>
