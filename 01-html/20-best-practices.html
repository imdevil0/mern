<!--
  !Topic: HTML Best Practices
  
  ?Introduction:
   * Writing good HTML is about more than just making the page work. It is about readability, accessibility, and maintenance.
  Analogy: It's the difference between throwing all your clothes in a pile (it works, you are dressed) vs organizing them neatly in a closet (easier to find, looks professional).
  
  ?Why do we use it?
   * To make code easier for other developers to read, to help search engines understand the content, and to ensure everyone (including disabled users) can use your site.
  
  ?Concepts:
   * 1. Always use a <!DOCTYPE html>.
   * 2. Close all tags properly.
   * 3. Write tags in lowercase.
   * 4. Always include 'alt' attributes in images.
   * 5. Use semantic elements instead of just <div>s.
-->

<!-- --- Basic Example --- -->
<!-- BAD PRACTICE -->
<DIV>
  <font size="5"><B>Welcome</B></font>
  <img src="logo.png">
</DIV>

<!-- GOOD PRACTICE -->
<header>
  <h1>Welcome</h1>
  <img src="logo.png" alt="Company Logo">
</header>
