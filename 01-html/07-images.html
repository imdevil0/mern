<!--
  !Topic: HTML Images
  
  ?Introduction:
   * The <img> tag is used to embed an image in a web page. It is an empty tag (no closing tag).
  Analogy: Like hanging a painting on the wall of your house.
  
  ?Why do we use it?
   * To add visual content, illustrations, and media to make a web page more engaging.
  
  ?Syntax:
   * <img src="image_url" alt="alternative_text">
-->

<!-- --- Basic Example --- -->
<!-- Basic image with source and alternative text (for accessibility/broken links) -->
<img src="https://via.placeholder.com/150" alt="A placeholder image">

<!-- Image with explicitly set width and height -->
<img src="logo.png" alt="Company Logo" width="200" height="100">
