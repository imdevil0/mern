<!--
  !Topic: Introduction to HTML
  
  ?Introduction:
   * HTML (HyperText Markup Language) is the standard language for creating web pages. It describes the structure of a web page using elements.
  Analogy: Think of HTML as the skeleton or blueprint of a house. It defines where the walls, doors, and windows go, but doesn't handle the paint.
  
  ?Why do we use it?
   * We use HTML to provide structure to web content so browsers know how to display text, images, and other media correctly.
  
  ?Syntax:
   * An HTML document requires a specific structure, starting with <!DOCTYPE html>.
-->

<!-- --- Basic Example --- -->
<!DOCTYPE html>
<html>
<head>
  <title>Document Title</title>
</head>
<body>
  <h1>Welcome to HTML!</h1>
</body>
</html>
