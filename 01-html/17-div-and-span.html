<!--
  !Topic: Div and Span
  
  ?Introduction:
   * <div> (block) and <span> (inline) are generic containers. They have no special semantic meaning of their own.
  Analogy: A <div> is an unlabeled cardboard box you use to group large items. A <span> is a clear plastic bag you use to wrap a small item inside a box.
  
  ?Why do we use it?
   * Primarily to group elements together for styling with CSS or manipulating with JavaScript when no other semantic tag fits.
  
  ?Syntax:
   * <div>...</div>
   * <span>...</span>
-->

<!-- --- Basic Example --- -->
<!-- Div grouping content -->
<div class="card">
  <h2>Card Title</h2>
  <p>This is some content inside a card.</p>
</div>

<!-- Span used for styling a specific piece of text -->
<p>My favorite color is <span style="color: blue; font-weight: bold;">blue</span>.</p>
