<!--
  !Topic: HTML Meta Tags
  
  ?Introduction:
   * Meta tags provide metadata about the HTML document. They are always placed inside the <head> element.
  Analogy: Like the fine print on the back of a book that tells the publisher, ISBN, and summary, but isn't part of the main story.
  
  ?Why do we use it?
   * To specify character sets, page descriptions, keywords, authors, and viewport settings for responsive design (SEO and browser instructions).
  
  ?Syntax:
   * <meta name="description" content="Free Web tutorials">
-->

<!-- --- Basic Example --- -->
<head>
  <!-- Character set (standard for all web pages) -->
  <meta charset="UTF-8">
  
  <!-- Makes the website responsive on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Description for search engines (SEO) -->
  <meta name="description" content="A comprehensive tutorial on HTML.">
  
  <!-- Author of the page -->
  <meta name="author" content="Karan">
</head>
