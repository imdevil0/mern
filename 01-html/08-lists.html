<!--
  !Topic: HTML Lists
  
  ?Introduction:
   * Lists group related items together. The main types are Unordered Lists (<ul>, bullet points) and Ordered Lists (<ol>, numbered).
  Analogy: Unordered lists are like a grocery list where order doesn't matter. Ordered lists are like a recipe where steps must be followed in sequence.
  
  ?Why do we use it?
   * To organize items in a readable, structured way (e.g., navigation menus, steps, feature lists).
  
  ?Syntax:
   * <ul><li>Item</li></ul> or <ol><li>Item</li></ol>
-->

<!-- --- Basic Example --- -->
<h3>Unordered List</h3>
<ul>
  <li>Apples</li>
  <li>Bananas</li>
  <li>Cherries</li>
</ul>

<h3>Ordered List</h3>
<ol>
  <li>Wake up</li>
  <li>Brush teeth</li>
  <li>Eat breakfast</li>
</ol>
