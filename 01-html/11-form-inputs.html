<!--
  !Topic: Form Inputs
  
  ?Introduction:
   * The <input> element can be displayed in many ways, depending on the "type" attribute (e.g., text, radio, checkbox, date).
  Analogy: Different types of blanks on a form. A "checkbox" is a square to tick, a "radio" is a multiple-choice circle.
  
  ?Why do we use it?
   * Different data needs different inputs (e.g., selecting a date from a calendar vs. typing a password).
  
  ?Syntax:
   * <input type="input_type">
-->

<!-- --- Basic Example --- -->
<!-- Text input -->
<input type="text" placeholder="Enter your name">

<!-- Checkbox -->
<input type="checkbox" id="subscribe" name="subscribe">
<label for="subscribe">Subscribe to newsletter</label>

<!-- Radio buttons (same name groups them) -->
<input type="radio" id="html" name="fav_language" value="HTML">
<label for="html">HTML</label>
<input type="radio" id="css" name="fav_language" value="CSS">
<label for="css">CSS</label>

<!-- Date picker -->
<input type="date" name="birthday">
