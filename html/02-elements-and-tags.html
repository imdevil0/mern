<!--
  !Topic: HTML Elements and Tags
  
  ?Introduction:
   * An HTML element is defined by a start tag, some content, and an end tag. Some elements are "empty" and self-closing.
  Analogy: Think of tags as labeled boxes. You put content inside the box and seal it. The label tells you what's inside.
  
  ?Why do we use it?
   * Elements and tags wrap content to tell the browser how to behave (e.g., this text is a heading, this text is a link).
  
  ?Syntax:
   * <tagname>Content goes here...</tagname>
-->

<!-- --- Basic Example --- -->
<!-- Standard element with opening and closing tags -->
<p>This is a paragraph element.</p>

<!-- Self-closing (empty) element -->
<br />
<hr />
