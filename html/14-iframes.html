<!--
  !Topic: HTML Iframes
  
  ?Introduction:
   * An iframe is used to embed another HTML document within the current HTML document.
  Analogy: Think of it as a window inside your house that looks into a completely different building.
  
  ?Why do we use it?
   * Often used to embed third-party content like YouTube videos, Google Maps, or external advertising.
  
  ?Syntax:
   * <iframe src="url" title="description"></iframe>
-->

<!-- --- Basic Example --- -->
<!-- Embedding a Wikipedia page -->
<iframe src="https://en.wikipedia.org/" width="100%" height="300" title="Wikipedia Homepage"></iframe>

<!-- Embedding a YouTube video -->
<iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
