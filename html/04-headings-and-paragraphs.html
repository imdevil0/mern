<!--
  !Topic: Headings and Paragraphs
  
  ?Introduction:
   * Headings (h1 to h6) define the titles or subtitles of a page. Paragraphs (p) define a block of text.
  Analogy: Think of a newspaper. The <h1> is the main front-page headline, <h2> are sub-headlines, and <p> is the actual story text.
  
  ?Why do we use it?
   * Headings provide a hierarchical structure for the document (important for SEO and screen readers). Paragraphs group related text together.
  
  ?Syntax:
   * <h1>Main Title</h1>
   * <p>Text content.</p>
-->

<!-- --- Basic Example --- -->
<h1>Main Website Title</h1>
<h2>Section Title</h2>
<p>This is a paragraph describing the section.</p>
<h3>Subsection</h3>
<p>More detailed text goes here.</p>
