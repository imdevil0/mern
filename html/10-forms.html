<!--
  !Topic: HTML Forms
  
  ?Introduction:
   * The <form> element is a container for different types of input elements, such as text fields, checkboxes, and submit buttons.
  Analogy: Like filling out a physical survey or application paper and handing it in.
  
  ?Why do we use it?
   * Forms are how users send data to the server (e.g., logging in, registering, searching).
  
  ?Syntax:
   * <form action="/submit_url" method="GET|POST"> ... </form>
-->

<!-- --- Basic Example --- -->
<form action="/login" method="POST">
  <label for="username">Username:</label><br>
  <input type="text" id="username" name="username"><br>
  
  <label for="password">Password:</label><br>
  <input type="password" id="password" name="password"><br><br>
  
  <button type="submit">Login</button>
</form>
