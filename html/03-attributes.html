<!--
  !Topic: HTML Attributes
  
  ?Introduction:
   * Attributes provide additional information about HTML elements. They are always specified in the start tag and come in name="value" pairs.
  Analogy: If an element is a person, attributes are their characteristics like eye color, height, or a name tag (id).
  
  ?Why do we use it?
   * We use them to configure elements, like setting the destination of a link (href), the source of an image (src), or providing unique identifiers (id).
  
  ?Syntax:
   * <tagname attributename="attributevalue">Content</tagname>
-->

<!-- --- Basic Example --- -->
<!-- The 'href' attribute provides the link address -->
<a href="https://www.google.com">Go to Google</a>

<!-- The 'id' and 'class' attributes are used for styling and scripting -->
<p id="main-para" class="text-highlight">This is an important paragraph.</p>
