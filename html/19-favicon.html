<!--
  !Topic: HTML Favicon
  
  ?Introduction:
   * A favicon (favorite icon) is a small image displayed next to the page title in the browser tab.
  Analogy: It's like the logo on a physical storefront sign; it helps people identify your site at a glance among many open tabs.
  
  ?Why do we use it?
   * It improves brand recognition and user experience, helping users find your website quickly in their browser tabs or bookmarks.
  
  ?Syntax:
   * <link rel="icon" type="image/x-icon" href="favicon.ico">
-->

<!-- --- Basic Example --- -->
<!DOCTYPE html>
<html>
<head>
  <title>My Awesome Website</title>
  <!-- The favicon link must be inside the <head> -->
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <h1>Look at the tab above!</h1>
</body>
</html>
