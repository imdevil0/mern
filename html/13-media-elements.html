<!--
  !Topic: Media Elements
  
  ?Introduction:
   * HTML provides the <audio> and <video> elements to embed sound and moving images directly into a web page.
  Analogy: Having a built-in TV and radio right inside your HTML house.
  
  ?Why do we use it?
   * To natively play media without relying on external plugins like the old Flash player.
  
  ?Syntax:
   * <audio src="audio.mp3" controls></audio>
-->

<!-- --- Basic Example --- -->
<!-- Audio Player -->
<audio controls>
  <source src="song.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<!-- Video Player -->
<video width="320" height="240" controls>
  <source src="movie.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>
