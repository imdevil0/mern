<!--
  !Topic: Text Formatting
  
  ?Introduction:
   * HTML contains elements for defining text with special meaning, like bold (<b>, <strong>) or italic (<i>, <em>).
  Analogy: Like using a highlighter or bold pen in a notebook to emphasize important words.
  
  ?Why do we use it?
   * To visually format text and to give semantic meaning (importance, emphasis) for accessibility and screen readers.
  
  ?Syntax:
   * <strong>Important text</strong>
-->

<!-- --- Basic Example --- -->
<p>This is <b>bold</b> and this is <strong>important (semantic bold)</strong>.</p>
<p>This is <i>italic</i> and this is <em>emphasized (semantic italic)</em>.</p>
<p>This is <mark>highlighted</mark>, <sub>subscript</sub>, and <sup>superscript</sup>.</p>
