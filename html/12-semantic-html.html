<!--
  !Topic: Semantic HTML
  
  ?Introduction:
   * Semantic HTML introduces tags that clearly describe their meaning to both the browser and the developer (e.g., <header>, <footer>, <article>).
  Analogy: Instead of storing all your stuff in generic boxes marked "Box", you use specific boxes marked "Kitchen Supplies", "Clothes", etc.
  
  ?Why do we use it?
   * It improves SEO (Search Engine Optimization) and accessibility (screen readers), making the code easier to read and maintain.
  
  ?Syntax:
   * <header>...</header>, <nav>...</nav>, <main>...</main>
-->

<!-- --- Basic Example --- -->
<header>
  <h1>Website Logo & Title</h1>
</header>

<nav>
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
  </ul>
</nav>

<main>
  <article>
    <h2>Blog Post Title</h2>
    <p>Blog post content goes here.</p>
  </article>
</main>

<footer>
  <p>&copy; 2026 My Website</p>
</footer>
