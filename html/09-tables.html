<!--
  !Topic: HTML Tables
  
  ?Introduction:
   * Tables allow you to arrange data into rows and columns using <table>, <tr> (table row), <th> (table header), and <td> (table data).
  Analogy: Think of an Excel spreadsheet with rows and columns to organize structured data.
  
  ?Why do we use it?
   * To display tabular data like schedules, pricing plans, or financial reports.
  
  ?Syntax:
   * <table> <tr> <th>Header</th> </tr> <tr> <td>Data</td> </tr> </table>
-->

<!-- --- Basic Example --- -->
<table border="1">
  <tr>
    <th>Name</th>
    <th>Age</th>
    <th>Role</th>
  </tr>
  <tr>
    <td>Alex</td>
    <td>25</td>
    <td>Developer</td>
  </tr>
  <tr>
    <td>Sam</td>
    <td>30</td>
    <td>Designer</td>
  </tr>
</table>
